<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Form di HTML</title>
</head>

<body>
    <center>
        <h1>Register IT Club</h1>
        <form action="">


            <label for="Nama">Nama:</label>
            <input type="text">
            <br>

            <br>
            <label for="Email">Email:</label>
            <input type="email">
            <br>

            <br>
            <label for="Password">Password:</label>
            <input type="password">
            <br>

            <br>
            <label for="jk">Jenis Kelamin</label>
            <br>

            <input type="radio" value="laki-laki" name="jk">
            <label for="laki-laki">Laki-Laki</label>
            <input type="radio" value="perempuan" name="jk">
            <label for="perempuan">Perempuan</label>

            <br>
            <label for="skill">Kemampuan yang ingin dipelajari</label>
            <br>
            <input type="checkbox" value="html" name="skill">
            <label for="html">HTML</label>
            <input type="checkbox" value="css" name="skill">
            <label for="css">CSS</label>
            <input type="checkbox" value="javaScript" name="skill">
            <label for="javaScript">JAVASCRIPT</label>
            <br>
            <br>

            <label for="alasan">Alasan Bergabung</label>
            <br>
            <textarea name="alasan" cols="50" rows="15"></textarea>

            <br>
            <input type="submit" name="submit" value="Daftar">  
            <br>

            <label for="birthday">birthday</label>
            <input type="date">
        </form>
</body>

</html>
